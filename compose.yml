name: askcam

services:
  vlm:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan}
    container_name: askcam-vlm
    restart: unless-stopped
    devices:
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-990}"
    volumes:
      - ./models:/models:ro
    ports:
      - "${VLM_PORT:-8080}:8080"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/${VLM_MODEL_FILE}
      - --mmproj
      - /models/${VLM_MMPROJ_FILE}
      - --alias
      - ${VLM_ALIAS:-vlm}
      - -ngl
      - "99"
      - -c
      - "${VLM_CTX:-8192}"
      - -np
      - "${VLM_PARALLEL:-2}"
      - --image-max-tokens
      - "${VLM_IMAGE_MAX_TOKENS:-512}"
      - -fa
      - "on"
      - --metrics
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  cams:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.21.3-ffmpeg}
    container_name: askcam-cams
    restart: unless-stopped
    volumes:
      - ./cams/mediamtx.yml:/mediamtx.yml:ro
      - ./media:/media:ro
    ports:
      - "${RTSP_PORT:-8554}:8554"
    healthcheck:
      # all three streams must exist and have a publisher
      test: ["CMD-SHELL", "for c in cam1 cam2 cam3; do ffprobe -v error -rtsp_transport tcp -timeout 5000000 -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 rtsp://127.0.0.1:8554/$$c | grep -q h264 || exit 1; done"]
      interval: 15s
      timeout: 20s
      retries: 6
      start_period: 20s
