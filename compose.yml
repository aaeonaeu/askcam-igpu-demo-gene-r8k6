name: askcam

services:
  vlm:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan@sha256:15fd15e1f1d2ab2daf4b0b88f5849d95764c155237f36e8f5d36b32a4cec1be9}
    container_name: askcam-vlm
    restart: unless-stopped
    devices:
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-990}"
    volumes:
      - ./models:/models:ro
      - ./vlm:/config:ro
    ports:
      - "${VLM_PORT:-8080}:8080"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # router mode: models and their settings come from vlm/models.ini, one loaded at a time;
      # askcam-ui switches the loaded model through the router API
      - --models-preset
      - /config/models.ini
      - --models-max
      - "1"
      - --metrics
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  cams:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.21.3-ffmpeg@sha256:208e9f1740a09a5ee63b6308e77ce0d54fce0456462f640e6bd9acfc62ebb5a2}
    container_name: askcam-cams
    restart: unless-stopped
    volumes:
      - ./cams/mediamtx.yml:/mediamtx.yml:ro
      - ./media:/media:ro
    ports:
      - "${RTSP_PORT:-8554}:8554"
    healthcheck:
      # all three streams must exist and have a publisher
      test: ["CMD-SHELL", "for c in cam1 cam2 cam3; do ffprobe -v error -rtsp_transport tcp -timeout 5000000 -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 rtsp://127.0.0.1:8554/$$c | grep -q h264 || exit 1; done"]
      interval: 15s
      timeout: 20s
      retries: 6
      start_period: 20s

  vlm-gate:
    image: ${NGINX_IMAGE:-nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de}
    container_name: askcam-vlm-gate
    restart: unless-stopped
    depends_on:
      - vlm
      - askcam-ui
    environment:
      - VLM_GATE_CONCURRENCY=${VLM_GATE_CONCURRENCY:-1}
      - VLM_GATE_RATE=${VLM_GATE_RATE:-8r/m}
    volumes:
      - ./vlm-gate/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frigate:
    image: ${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:0.18.2-rocm@sha256:d659f0967627e7bd0b29c96bc396e436ce041aa40bf19e213f02bdade6092a83}
    container_name: askcam-frigate
    restart: unless-stopped
    depends_on:
      cams:
        condition: service_healthy
    shm_size: 512mb
    # Backstop: frigate.embeddings_manager (GenAI descriptions) used to grow ~5 GiB/h until the kernel OOM killer picked
    # victims host-wide (it has killed llama-server). frigate/patches/ fixes the leak; with this limit a runaway process
    # would die inside Frigate only and be restarted by its watchdog. No swap for it: swapping makes the box crawl.
    mem_limit: 5g
    memswap_limit: 5g
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-990}"
    environment:
      - TZ=Europe/Rome
      # VA-API driver for the iGPU video decode engine
      - LIBVA_DRIVER_NAME=radeonsi
    volumes:
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      # Fix for the embeddings memory leak (frigate/patches/README.md). These are full copies of two files of Frigate
      # 0.18.2: remove both lines if FRIGATE_IMAGE points to any other version.
      - ./frigate/patches/maintainer.py:/opt/frigate/frigate/embeddings/maintainer.py:ro
      - ./frigate/patches/object_descriptions.py:/opt/frigate/frigate/data_processing/post/object_descriptions.py:ro
    tmpfs:
      - /tmp/cache:size=1g
    ports:
      - "${FRIGATE_UI_PORT:-8971}:8971"
      # unauthenticated API/UI, loopback only (used by scripts on the host)
      - "127.0.0.1:5000:5000"

  askcam-ui:
    build: ./askcam-ui
    image: askcam-ui:local
    container_name: askcam-ui
    restart: unless-stopped
    depends_on:
      frigate:
        condition: service_healthy
      vlm:
        condition: service_healthy
    environment:
      - FRIGATE_URL=http://frigate:5000
      # questions go straight to the VLM; only Frigate's GenAI goes through vlm-gate
      - VLM_URL=http://vlm:8080
      - HOST_SYS=/host/sys
    volumes:
      # read-only: gpu_busy_percent, mem_info_gtt_*, hwmon power/temperature
      - /sys:/host/sys:ro
      # model presets (read-only) and model files (only to show their size / whether they are downloaded)
      - ./vlm:/config:ro
      - ./models:/models:ro
    ports:
      - "${UI_PORT:-8000}:8000"
