; Model presets for the llama.cpp router (llama-server --models-preset).
; One section per model; only one model is loaded at a time (--models-max 1).
; A "; size-gib: N" comment (download size, read only by askcam-ui) lets the UI judge the fit before the files exist.
; Keys are llama-server options without the leading dashes. Paths are inside the container (./models is /models).
; Add a model: download the GGUF + mmproj into ./models (scripts/fetch-models.sh) and add a section below.

[*]
n-gpu-layers = 99
flash-attn = on
ctx-size = 8192
parallel = 2
image-max-tokens = 512

[qwen2.5-vl-3b]
model = /models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf
load-on-startup = true

; Same files, fewer image tokens: faster first word, less detail. Handy to see what that setting costs/buys.
[qwen2.5-vl-3b-lite]
model = /models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf
image-max-tokens = 256

; Not downloaded by default. Fetch with scripts/fetch-models.sh gemma | qwen7b, then pick it in the askcam-ui "Model" menu.
[gemma-3-4b]
; size-gib: 3.1
model = /models/gemma-3-4b-it-Q4_K_M.gguf
mmproj = /models/mmproj-gemma-3-4b-it-f16.gguf

; 7B: about 6.5 GiB with everything else running is more than this 16 GB machine can hold (see NOTES.md); it needs a
; smaller context, one slot and fewer image tokens, and the UI will warn that it probably does not fit.
[qwen2.5-vl-7b]
; size-gib: 5.2
model = /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf
ctx-size = 4096
parallel = 1
